<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Content Security Policy. This app renders through innerHTML, so an escaping slip anywhere in
     app.js would otherwise become script execution — and the key that decrypts your cloud data is on
     this device, so that is not a cosmetic problem. There is no inline JavaScript in this file, which
     is what makes `script-src 'self'` possible: an injected <script> or onerror= simply won't run.
     `style-src` still needs 'unsafe-inline' because the UI leans on inline style="" attributes, so
     this is defence in depth, not a substitute for escaping. connect-src lists every origin the app
     genuinely talks to; anything else is blocked, which also limits where an injection could
     exfiltrate to. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data: blob: https:;
  media-src 'self' blob:;
  connect-src 'self' https://kkorqjoltzkgrtngmaiy.supabase.co https://www.googleapis.com https://openlibrary.org https://covers.openlibrary.org https://api.themoviedb.org https://image.tmdb.org;
  worker-src 'self';
  manifest-src 'self';
  object-src 'none';
  base-uri 'none';
  form-action 'none'">
<!-- Deliberately NOT set here: frame-ancestors. It is ignored when delivered via <meta> — the browser
     logs a warning and applies nothing — so listing it would be decoration, not protection. Blocking
     framing needs a real response header, which GitHub Pages cannot send. Anyone self-hosting behind
     a server or CDN should add `Content-Security-Policy: frame-ancestors 'none'` there. -->
<title>LifeHub — Your Life OS</title>
<meta name="description" content="All your life. All in one place. Habits, health, learning, projects and more — with XP, streaks and badges.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6a5ae0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LifeHub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app">

  <!-- Desktop / tablet sidebar -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="side-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48"><rect width="48" height="48" rx="14" class="mark-bg"/><g class="mark-leaf" transform="translate(24 24)"><g><ellipse cx="0" cy="-10.1" rx="3.2" ry="6.9"/><g transform="rotate(60)"><ellipse cx="0" cy="-10.1" rx="3.2" ry="6.9"/></g><g transform="rotate(120)"><ellipse cx="0" cy="-10.1" rx="3.2" ry="6.9"/></g><g transform="rotate(180)"><ellipse cx="0" cy="-10.1" rx="3.2" ry="6.9"/></g><g transform="rotate(240)"><ellipse cx="0" cy="-10.1" rx="3.2" ry="6.9"/></g><g transform="rotate(300)"><ellipse cx="0" cy="-10.1" rx="3.2" ry="6.9"/></g></g></g><circle cx="24" cy="24" r="3.6" class="mark-bg"/><circle cx="24" cy="24" r="3.6" fill="none" stroke-width="1.6" class="mark-leaf-stroke"/></svg>
      </span>
      <span class="brand-text">
        <strong>LifeHub</strong>
        <small>your life OS</small>
      </span>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Open navigation"></button>
      <div class="topbar-title">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub"></p>
      </div>
      <div class="topbar-actions">
        <button class="chip chip-streak" id="streakChip" data-nav="progress" title="Perfect-day streak"></button>
        <button class="chip chip-level" id="levelChip" data-nav="profile" title="Your level and XP"></button>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle light / dark theme"></button>
        <button class="avatar-btn" id="avatarBtn" data-nav="profile" aria-label="Open profile"></button>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<!-- Mobile bottom navigation -->
<nav class="bottomnav" id="bottomNav" aria-label="Quick navigation"></nav>

<!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<!-- Mobile nav drawer -->
<div class="drawer-backdrop" id="drawerBackdrop" hidden>
  <aside class="drawer" id="drawer" aria-label="All areas"></aside>
</div>

<!-- Running focus session. Deliberately OUTSIDE #view: the app re-renders a view by replacing that
     element's innerHTML, so a timer living inside it would be destroyed on every navigation. -->
<div class="focus-bar" id="focusBar" role="status" aria-live="polite" hidden></div>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<div class="tip" id="tip" hidden></div>

<script src="app.js"></script>
</body>
</html>
